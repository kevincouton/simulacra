[workspace]
resolver = "2"
members = [
    "crates/agents",
    "crates/env",
    "crates/engine",
    "crates/demo",
    "crates/tracker",
    "crates/server",
]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
lto = true

[workspace.lints.clippy]
# Google Rust Style Guide aligned lints (see RUST_STYLE.md)
wildcard_imports = "deny"
uninlined_format_args = "deny"
implicit_clone = "deny"
redundant_field_names = "deny"
ptr_arg = "deny"
