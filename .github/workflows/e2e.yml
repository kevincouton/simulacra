name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  e2e:
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the server (release)
        run: cargo build --release -p simulacra-server

      - name: Build the playground UI
        working-directory: web
        run: npm ci && npx nuxi build

      - name: Install chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Start simulacra-server
        run: |
          SIMULACRA_ROOT="$GITHUB_WORKSPACE" SIMULACRA_BIND=127.0.0.1:31011 \
            ./target/release/simulacra-server &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:31011/healthz && break || sleep 1
          done

      - name: Run the e2e suites
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:31011
        run: npx playwright test
